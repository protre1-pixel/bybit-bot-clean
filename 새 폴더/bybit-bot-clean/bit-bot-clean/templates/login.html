<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Bot - 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .toggle-form a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        .error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
        }

        .success {
            color: #10b981;
            font-size: 12px;
            margin-top: 5px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 로그인 폼 -->
        <div id="login-form" class="form-section active">
            <div class="header">
                <div class="icon">🤖</div>
                <h1>Bybit Bot</h1>
                <p>로그인</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">사용자명</label>
                    <input type="text" id="login-username" required>
                    <div class="error" id="login-username-error"></div>
                </div>

                <div class="form-group">
                    <label for="login-password">비밀번호</label>
                    <input type="password" id="login-password" required>
                    <div class="error" id="login-password-error"></div>
                </div>

                <button type="submit">로그인</button>
            </form>

            <div class="toggle-form">
                계정이 없으신가요? <a onclick="switchForm('signup')">회원가입</a>
            </div>
        </div>

        <!-- 회원가입 폼 -->
        <div id="signup-form" class="form-section">
            <div class="header">
                <div class="icon">🤖</div>
                <h1>Bybit Bot</h1>
                <p>회원가입</p>
            </div>

            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signup-username">사용자명</label>
                    <input type="text" id="signup-username" required>
                    <div class="error" id="signup-username-error"></div>
                </div>

                <div class="form-group">
                    <label for="signup-password">비밀번호</label>
                    <input type="password" id="signup-password" required>
                    <div class="error" id="signup-password-error"></div>
                </div>

                <div class="form-group">
                    <label for="signup-password-confirm">비밀번호 확인</label>
                    <input type="password" id="signup-password-confirm" required>
                    <div class="error" id="signup-password-confirm-error"></div>
                </div>

                <button type="submit">회원가입</button>
            </form>

            <div class="toggle-form">
                이미 계정이 있으신가요? <a onclick="switchForm('login')">로그인</a>
            </div>
        </div>
    </div>

    <script>
        function switchForm(form) {
            document.getElementById('login-form').classList.remove('active');
            document.getElementById('signup-form').classList.remove('active');
            document.getElementById(form + '-form').classList.add('active');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                console.log('로그인 응답:', data);

                if (data.success && data.token) {
                    console.log('로그인 성공, 토큰:', data.token.substring(0, 20) + '...');

                    // 토큰을 로컬스토리지에 저장
                    sessionStorage.setItem('authToken', data.token);
                    sessionStorage.setItem('username', username);

                    // 저장 확인
                    const savedToken = sessionStorage.getItem('authToken');
                    const savedUsername = sessionStorage.getItem('username');
                    console.log('✅ sessionStorage 저장 완료:');
                    console.log('  - token:', savedToken ? '✓ 저장됨' : '✗ 저장안됨');
                    console.log('  - username:', savedUsername);

                    alert(`✅ 로그인 완료! ${username}님 환영합니다!`);

                    // 조금 더 대기했다가 이동
                    setTimeout(() => {
                        console.log('페이지 이동:', '/');
                        window.location.href = '/';
                    }, 1000);
                } else {
                    alert(`❌ ${data.error}`);
                    console.log('로그인 실패:', data.error);
                }
            } catch (error) {
                alert(`❌ 로그인 실패: ${error.message}`);
                console.error('로그인 에러:', error);
            }
        }

        async function handleSignup(event) {
            event.preventDefault();
            const username = document.getElementById('signup-username').value;
            const password = document.getElementById('signup-password').value;
            const passwordConfirm = document.getElementById('signup-password-confirm').value;

            // 비밀번호 확인
            if (password !== passwordConfirm) {
                alert('❌ 비밀번호가 일치하지 않습니다');
                return;
            }

            if (password.length < 4) {
                alert('❌ 비밀번호는 최소 4자 이상이어야 합니다');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✅ 회원가입 완료! 로그인해주세요.`);
                    switchForm('login');
                    document.getElementById('login-username').value = username;
                } else {
                    alert(`❌ ${data.error}`);
                }
            } catch (error) {
                alert(`❌ 회원가입 실패: ${error.message}`);
            }
        }

        // 페이지 로드 시 이미 로그인했으면 메인 페이지로 이동
        async function checkAuth() {
            try {
                const token = sessionStorage.getItem('authToken');
                if (!token) {
                    return;
                }

                const response = await fetch('/api/auth/check', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();

                if (data.authenticated) {
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('인증 확인 실패:', error);
            }
        }

        checkAuth();
    </script>
</body>
</html>
